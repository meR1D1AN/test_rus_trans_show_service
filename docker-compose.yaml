services:
  db:
    container_name: rus_trans_db
    image: postgres:17.6
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - 5432
    volumes:
      - rus_trans_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', '-c', 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DB' ]
      interval: 5s
      retries: 5
      timeout: 10s

  app:
    container_name: rus_trans_api
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    ports:
      - "${PORT_API}:${PORT_API}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static:/app/static
    env_file:
      - .env
    command: >
      sh -c 'uv run python3 manage.py collectstatic --noinput &&
             uv run python3 manage.py makemigrations --noinput &&
             uv run python3 manage.py migrate &&
             uv run python3 manage.py test_create &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:${PORT_API} --workers 3 --timeout 60 --preload'

  certbot_init:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot -d mered1an.ru --email mered1an@live.com --agree-tos --no-eff-email


  nginx:
    image: nginx:1.29.1
    container_name: rus_trans_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/static
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt  # ВАЖНО: чтобы nginx видел сертификаты

volumes:
  rus_trans_data:
  certbot_conf:
  certbot_www: