services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - 5432
    volumes:
      - rus_trans_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', '-c', 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DB' ]
      interval: 5s
      retries: 5
      timeout: 10s
    networks:
      - rus_trans

  app:
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    ports:
      - "${PORT_APP}:${PORT_APP}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - rus_trans_static:/app/static
      - rus_trans_media:/app/media
    env_file:
      - .env
    command: >
      sh -c 'uv run python3 manage.py collectstatic --noinput &&
             uv run python3 manage.py makemigrations --noinput &&
             uv run python3 manage.py migrate &&
             uv run python3 manage.py test_create &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:${PORT_APP} --workers 3 --timeout 60 --preload'
    networks:
      - rus_trans

  certbot_init:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot -d mer1d1an.ru --email mered1an@live.com --agree-tos --no-eff-email
    networks:
      - rus_trans

  nginx:
    image: nginx:1.29.1
    container_name: rus_trans_nginx
    restart: unless-stopped
    ports:
      - "${PORT_NGINX}:${PORT_NGINX}"
      - "${PORT_NGINX_SSL}:${PORT_NGINX_SSL}"
    depends_on:
      - app
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - rus_trans_static:/app/static
      - rus_trans_media:/app/media
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    networks:
      - rus_trans

networks:
  rus_trans:
    name: rus_trans

volumes:
  rus_trans_data:
  rus_trans_static:
  rus_trans_media:
  certbot_conf:
  certbot_www: