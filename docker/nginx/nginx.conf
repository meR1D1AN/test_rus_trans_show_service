events {
    worker_connections 1024;
}

http {
    upstream django_app {
        server app:8000;  # Твой gunicorn
    }

    server {
        listen 80;
        server_name mered1an.ru;

        # ACME challenge: NGINX отдаёт файлы из Certbot (твоя идея!)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Static files
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Всё остальное: redirect на HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name mered1an.ru;

        # SSL от Certbot (fullchain и privkey)
        ssl_certificate /etc/letsencrypt/live/mered1an.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mered1an.ru/privkey.pem;

        # TLS best practices
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:le_nginx_SSL:10m;
        ssl_session_timeout 1440m;
        ssl_session_tickets off;

        # Proxy к Django
        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Static на HTTPS
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}