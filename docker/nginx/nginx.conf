events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name mer1d1an.ru;

        # Отдаём challenge для certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Всё остальное сразу редиректим на https
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name mer1d1an.ru;

        # Пути к сертификатам (они внутри volume certbot_conf)
        ssl_certificate     /etc/letsencrypt/live/mer1d1an.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mer1d1an.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Отдаём challenge для certbot (нужно и тут, для автообновления)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Проксируем на Django
        location / {
            proxy_pass http://app:8000;  # если PORT_API=8000
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Отдача статики напрямую (если нужно)
        location /static/ {
            alias /app/static/;
        }

        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public";
        }
    }
}