# Глобальные директивы (http блок)
events {
    worker_connections 1024;
}

http {
    # Resolver для ACME (DNS-запросы к LE)
    resolver 8.8.8.8 valid=300s;  # Google DNS, или твой

    # ACME issuer для Let's Encrypt (staging для теста: https://acme-staging-v02.api.letsencrypt.org/directory)
    acme_issuer letsencrypt {
        uri https://acme-v02.api.letsencrypt.org/directory;  # Prod LE
        contact mailto:mered1an@live.com;  # Твоя почта
        state_path /var/cache/nginx/acme-letsencrypt;  # Монтировано
        accept_terms_of_service;
    }

    # Shared memory для certs и challenges
    acme_shared_zone zone=acme_shared:1M;

    # Upstream для app
    upstream django_app {
        server app:8000;  # Твой ${PORT_API}, hardcode для простоты
    }

    # HTTP сервер (80): для ACME challenges + redirect
    server {
        listen 80;
        server_name mered1an.ru;

        # ACME-модуль сам обработает /.well-known/acme-challenge/ — не трогай!
        # Остальное: redirect на HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }

        # Static (если challenge не совпадёт)
        location /static/ {
            alias /app/static/;
            expires 30d;
        }
    }

    # HTTPS сервер (443): с auto-cert
    server {
        listen 443 ssl http2;
        server_name mered1an.ru;

        # ACME: NGINX сам выдаст/renew'ит cert
        acme_certificate letsencrypt {
            domains mered1an.ru;
        }

        # SSL с переменными от ACME
        ssl_certificate $acme_certificate;
        ssl_certificate_key $acme_certificate_key;
        ssl_certificate_cache max=2;

        # TLS best practices (как раньше)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

        # Proxy к Django
        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static
        location /static/ {
            alias /app/static/;
            expires 30d;
        }
    }
}