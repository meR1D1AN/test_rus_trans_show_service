{% extends "transport_app/base.html" %}
<title>{% block title %}Вход — Транспорт{% endblock %}</title>
{% block content %}

<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center" style="margin-top:8vh">
      <div class="col-12 col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-4">Вход в систему</h3>
            {% if form.errors %}
              <div class="alert alert-danger">Неверное имя пользователя или пароль.</div>
            {% endif %}
            <form method="post" novalidate>
              {% csrf_token %}
              <div class="mb-3">
                <label for="id_username" class="form-label">Имя пользователя</label>
                <input type="text" name="username" autofocus maxlength="150" class="form-control" id="id_username" required>
              </div>
              <div class="mb-3">
                <label for="id_password" class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" id="id_password" required>
              </div>
              <div class="mb-3 form-check">
                <input type="checkbox" name="remember" class="form-check-input" id="id_remember">
                <label class="form-check-label" for="id_remember">Запомнить меня</label>
              </div>
              <button type="submit" class="btn btn-primary">Войти</button>
            </form>
            <hr/>
            <div class="text-muted small mt-3">
              Доступ только для зарегистрированных пользователей.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
{% endblock %}
