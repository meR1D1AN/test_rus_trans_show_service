<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Транспортное приложение{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<nav class="mb-4">
    {% if user.is_authenticated %}
    <a href="{% url 'transport_app:order_list' %}" class="btn btn-primary">Заявки</a>
    <a href="{% url 'transport_app:location_list' %}" class="btn btn-primary">Местоположения</a>
    {% if user.is_superuser %}
    <a href="{% url 'users:user_list' %}" class="btn btn-primary">Менеджеры/Водители</a>
    {% endif %}
    <form action="{% url 'logout' %}" method="post" style="display: inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger ms-2">Выйти</button>
    </form>
    {% endif %}
</nav>
{% block content %}
{% endblock %}
</body>
</html>
