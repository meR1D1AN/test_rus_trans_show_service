{% extends "transport_app/base.html" %}
<title>{% block title %}Удаление заявки{% endblock %}</title>
{% block content %}

<h2>Удалить заявку {{ object.id }}?</h2>
<p>Описание: {{ object.description }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'transport_app:order_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
