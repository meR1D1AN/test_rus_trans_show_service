{% extends "transport_app/base.html" %}
<title>{% block title %}Удаление местоположения{% endblock %}</title>
{% block content %}

<h2>Удалить заявку {{ location.id }}?</h2>
<p>Заявка: {{ location.order }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'transport_app:location_detail' location.id %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
